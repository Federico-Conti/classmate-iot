<script type="text/javascript">
    RED.nodes.registerType('classmate-outbox-publisher', {
        category: 'storage',
        color: '#d9d9d9',
        defaults: {
            name: { value: '' },
            database: { value: '/data/sqlite/classmate.db', required: true },
            broker: { value: '', type: 'mqtt-broker', required: true },
        },
        inputs: 1,
        outputs: 0,
        icon: 'db.svg',
        label: function () {
            return this.name || 'Publish attendance outbox';
        },
    });
</script>

<script type="text/html" data-template-name="classmate-outbox-publisher">
    <div class="form-row">
        <label for="node-input-name">Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-database">Database</label>
        <input type="text" id="node-input-database">
    </div>
    <div class="form-row">
        <label for="node-input-broker">Broker</label>
        <input type="text" id="node-input-broker">
    </div>
</script>

<script type="text/html" data-help-name="classmate-outbox-publisher">
    <p>Publishes pending attendance events at QoS 1 with retain enabled, then marks them published after broker acknowledgement.</p>
</script>

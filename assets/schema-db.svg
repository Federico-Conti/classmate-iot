    <path d="M 1176 275 H 1544 Q 1560 275 1560 291 V 330 H 1160 V 291 Q 1160 275 1176 275" fill="#0d7d82"/>
    <text x="1183" y="312" class="table-title">children</text>
    <text x="1183" y="361" class="row">id <tspan fill="#0d7d82" font-weight="700">PK</tspan></text><text x="1534" y="361" class="type">TEXT</text>
    <text x="1183" y="397" class="row">name</text><text x="1534" y="397" class="type">TEXT</text>
    <text x="1183" y="433" class="row">surname</text><text x="1534" y="433" class="type">TEXT</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="620" y="595" width="400" height="261" rx="16"/>
    <path d="M 636 595 H 1004 Q 1020 595 1020 611 V 650 H 620 V 611 Q 620 595 636 595" fill="#6154aa"/>
    <text x="643" y="632" class="table-title">device_state</text>
    <text x="643" y="681" class="row">device_id <tspan fill="#6154aa" font-weight="700">PK, FK</tspan></text><text x="994" y="681" class="type">TEXT</text>
    <text x="643" y="717" class="row">last_received_at</text><text x="994" y="717" class="type">TEXT</text>
    <text x="643" y="753" class="row">last_boot_id</text><text x="994" y="753" class="type">TEXT</text>
    <text x="643" y="789" class="row">last_sequence</text><text x="994" y="789" class="type">INTEGER</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1160" y="595" width="400" height="261" rx="16"/>
    <path d="M 1176 595 H 1544 Q 1560 595 1560 611 V 650 H 1160 V 611 Q 1160 595 1176 595" fill="#0d7d82"/>
    <text x="1183" y="632" class="table-title">devices</text>
    <text x="1183" y="681" class="row">id <tspan fill="#0d7d82" font-weight="700">PK</tspan></text><text x="1534" y="681" class="type">TEXT</text>
    <text x="1183" y="717" class="row">child_id <tspan fill="#0d7d82" font-weight="700">FK, UQ, NULL</tspan></text><text x="1534" y="717" class="type">TEXT</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="620" y="951" width="400" height="261" rx="16"/>
    <path d="M 636 951 H 1004 Q 1020 951 1020 967 V 1006 H 620 V 967 Q 620 951 636 951" fill="#6154aa"/>
    <text x="643" y="988" class="table-title">event_outbox</text>
    <text x="643" y="1037" class="row">event_id <tspan fill="#6154aa" font-weight="700">PK, FK</tspan></text><text x="994" y="1037" class="type">TEXT</text>
    <text x="643" y="1073" class="row">topic</text><text x="994" y="1073" class="type">TEXT</text>
    <text x="643" y="1109" class="row">payload <tspan fill="#6154aa" font-weight="700">JSON</tspan></text><text x="994" y="1109" class="type">TEXT</text>
    <text x="643" y="1145" class="row">published_at <tspan fill="#6154aa" font-weight="700">NULL</tspan></text><text x="994" y="1145" class="type">TEXT</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1160" y="951" width="400" height="261" rx="16"/>
    <path d="M 1176 951 H 1544 Q 1560 951 1560 967 V 1006 H 1160 V 967 Q 1160 951 1176 951" fill="#0d7d82"/>
    <text x="1183" y="988" class="table-title">attendance_events</text>
    <text x="1183" y="1037" class="row">event_id <tspan fill="#0d7d82" font-weight="700">PK</tspan></text><text x="1534" y="1037" class="type">TEXT</text>
    <text x="1183" y="1073" class="row">child_id <tspan fill="#0d7d82" font-weight="700">FK</tspan></text><text x="1534" y="1073" class="type">TEXT</text>
    <text x="1183" y="1109" class="row">device_id <tspan fill="#0d7d82" font-weight="700">FK</tspan></text><text x="1534" y="1109" class="type">TEXT</text>
    <text x="1183" y="1145" class="row">type, received_at</text><text x="1534" y="1145" class="type">TEXT</text>
    <text x="1183" y="1181" class="row">weighted_rssi</text><text x="1534" y="1181" class="type">REAL</text>
  </g>

</svg>

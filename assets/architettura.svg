<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="865" viewBox="48 143 1728 865" role="img" aria-labelledby="title desc"><title id="title">ClassMate — System Architecture</title><desc id="desc">A simulated ESP32 in Wokwi publishes MQTT telemetry to Mosquitto. Node-RED validates and filters RSSI, stores events and an outbox in SQLite, then publishes confirmed events to Mosquitto. ParentApp receives retained events via MQTT and accesses code resolution and history over HTTP.</desc><defs>
